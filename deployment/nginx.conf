server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API requests
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy root pipeline requests
    location /upload {
        proxy_pass http://backend:8000/upload;
        proxy_set_header Host $host;
    }

    location /optimize {
        proxy_pass http://backend:8000/optimize;
        proxy_set_header Host $host;
    }

    location /predict_policy {
        proxy_pass http://backend:8000/predict_policy;
        proxy_set_header Host $host;
    }

    location /detect {
        proxy_pass http://backend:8000/detect;
        proxy_set_header Host $host;
    }

    location /ocr {
        proxy_pass http://backend:8000/ocr;
        proxy_set_header Host $host;
    }

    location /package {
        proxy_pass http://backend:8000/package;
        proxy_set_header Host $host;
    }

    location /dashboard {
        proxy_pass http://backend:8000/dashboard;
        proxy_set_header Host $host;
    }

    location /history {
        proxy_pass http://backend:8000/history;
        proxy_set_header Host $host;
    }

    location /analytics {
        proxy_pass http://backend:8000/analytics;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /enhance {
        proxy_pass http://backend:8000/enhance;
        proxy_set_header Host $host;
    }

    location /plugins {
        proxy_pass http://backend:8000/plugins;
        proxy_set_header Host $host;
    }

    location /uploads {
        proxy_pass http://backend:8000/uploads;
        proxy_set_header Host $host;
    }

    location /outputs {
        proxy_pass http://backend:8000/outputs;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
